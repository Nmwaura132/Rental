services:
  db:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    env_file: ${ENV_FILE:-.env.production}
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/mediafiles
    env_file: ${ENV_FILE:-.env.production}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             (python manage.py collectstatic --noinput || true) &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --worker-class gevent --worker-connections 100 --timeout 120 --access-logfile - --error-logfile -"
    security_opt:
      - no-new-privileges:true

  celery-payments:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info --concurrency=2 -Q payments
    security_opt:
      - no-new-privileges:true

  celery-notifications:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info --concurrency=2 -Q notifications
    security_opt:
      - no-new-privileges:true

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    security_opt:
      - no-new-privileges:true

  minio-permissions:
    # WHY: Chainguard's MinIO runs as uid 65532, but the data was written by
    # the old root-run image and a new volume is root-owned. This hands the
    # volume over before MinIO starts; it is a no-op once done.
    image: alpine:3.22
    restart: "no"
    volumes:
      - minio_data:/data
    command: ["chown", "-R", "65532:65532", "/data"]

  minio:
    # WHY Chainguard's build: MinIO removed minio/minio from Docker Hub and
    # Quay. This is built from the same open-source code and still published.
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    depends_on:
      minio-permissions:
        condition: service_completed_successfully
    env_file: ${ENV_FILE:-.env.production}
    # WHY expose rather than publish: signed URLs for national ID photos and lease
    # PDFs must not be served over plain HTTP. Publishing 9000 put MinIO on the
    # host at http://<ip>:9000 with no TLS, so the signature and the document both
    # travelled in the clear. Traefik now terminates TLS in front of it and reaches
    # 9000 over the internal network only. 9001 (admin console) stays unreachable —
    # use `ssh -L 9001:localhost:9001 vps`.
    expose:
      - "9000"
    # WHY labels here rather than a domain set in the Coolify UI: this is the only
    # record of how media is routed, and it belongs next to the service it routes
    # in version control. Mirrors the entryPoint/certresolver pair Coolify
    # generates for the api service so both are issued by the same ACME resolver.
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.kasa-minio-http.entryPoints=http
      - traefik.http.routers.kasa-minio-http.rule=Host(`files-rwrwarkqwn77gwu6zbky1ppo.37.221.93.219.sslip.io`)
      - traefik.http.routers.kasa-minio-http.middlewares=redirect-to-https
      - traefik.http.routers.kasa-minio-http.service=kasa-minio
      - traefik.http.routers.kasa-minio-https.entryPoints=https
      - traefik.http.routers.kasa-minio-https.rule=Host(`files-rwrwarkqwn77gwu6zbky1ppo.37.221.93.219.sslip.io`)
      - traefik.http.routers.kasa-minio-https.tls=true
      - traefik.http.routers.kasa-minio-https.tls.certresolver=letsencrypt
      - traefik.http.routers.kasa-minio-https.service=kasa-minio
      - traefik.http.services.kasa-minio.loadbalancer.server.port=9000
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      # The Chainguard image has no curl; mc ships with it. A down server makes
      # mc wait, which the healthcheck timeout turns into "unhealthy".
      test: ["CMD-SHELL", "MC_HOST_local=http://127.0.0.1:9000 mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  create-buckets:
    # WHY the backup image and not minio/mc: MinIO took the mc image off
    # Docker Hub, so pulling it failed every deploy. backup/store.py does the
    # same three things over the S3 API.
    build:
      context: ./backup
    restart: "no"
    env_file: ${ENV_FILE:-.env.production}
    environment:
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      BACKUP_BUCKET=${MINIO_BUCKET_NAME} python /store.py ensure-bucket &&
      BACKUP_BUCKET=${MINIO_BUCKET_NAME} python /store.py make-private &&
      BACKUP_BUCKET=kasa-backups python /store.py ensure-bucket
      "

  db-backup:
    # WHY: mysql_data is a single Docker volume on a single VPS. Daily dump to
    # a separate MinIO bucket gives one-machine-disaster recovery. For true
    # off-site, an operator should run `mc mirror` from this bucket to an
    # external S3 weekly.
    build:
      context: ./backup
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BACKUP_BUCKET: kasa-backups
      BACKUP_HOUR: "2"        # 02:00 EAT — quiet hour
      RETENTION_DAYS: "30"
      TZ: Africa/Nairobi
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
  static_files:
  media_files:
  minio_data:
