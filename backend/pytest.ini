[pytest]
# WHY: tests live under backend/tests/; manage.py picks settings from config.settings.
# --reuse-db speeds repeat runs by 5-10x; the schema is stable enough that we can
# drop and recreate manually when migrations change.
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test
python_functions = test_*
testpaths = tests
addopts = -ra --strict-markers --tb=short --reuse-db
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
