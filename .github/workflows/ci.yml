name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Django + pytest + pip-audit)
    runs-on: ubuntu-latest

    # WHY use a service container instead of SQLite: Kasa relies on
    # select_for_update() for payment row locks. SQLite serializes everything
    # so it would silently no-op the lock test. MySQL service container
    # mirrors production fidelity.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: rental_db
          MYSQL_USER: rental_user
          MYSQL_PASSWORD: rental_pw
          MYSQL_ROOT_PASSWORD: root_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot_pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Test-only credentials; real prod creds live in Coolify secrets.
      SECRET_KEY: ci-test-secret-key-not-for-production-use-only
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: rental_db
      DB_USER: rental_user
      DB_PASSWORD: rental_pw
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      MPESA_ENVIRONMENT: sandbox

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps (mysqlclient + libffi)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential

      - name: Install Python deps
        # WHY upgrade pip first: pip-audit below audits the whole environment,
        # pip included, so a stale runner pip fails the job even when every
        # application dependency is clean.
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit

      - name: Grant CREATE on test_* to rental_user
        run: |
          mysql -h 127.0.0.1 -uroot -proot_pw -e \
            "GRANT ALL PRIVILEGES ON \`test_%\`.* TO 'rental_user'@'%'; FLUSH PRIVILEGES;"

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Migration drift check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: pytest
        working-directory: backend
        run: pytest -ra

      - name: pip-audit
        working-directory: backend
        run: pip-audit

  mobile:
    name: Mobile (analyze + tests + signed Android bundle)
    runs-on: ubuntu-latest
    env:
      KASA_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/upload-keystore.jks
      KASA_KEYSTORE_PASSWORD: ci-release-password
      KASA_KEY_ALIAS: upload
      KASA_KEY_PASSWORD: ci-release-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        working-directory: mobile
        run: flutter pub get

      - name: analyze
        working-directory: mobile
        run: flutter analyze

      - name: test
        working-directory: mobile
        run: flutter test

      - name: Create ephemeral Android signing key
        working-directory: mobile/android
        run: |
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -storepass "$KASA_KEYSTORE_PASSWORD" \
            -keypass "$KASA_KEY_PASSWORD" \
            -alias "$KASA_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Kasa CI, OU=Engineering, O=Kasa, L=Nairobi, C=KE"

      - name: Build signed Android App Bundle
        working-directory: mobile
        run: >-
          flutter build appbundle --release
          --dart-define=API_BASE_URL=https://api.example.invalid

      - name: Verify Android bundle signature
        working-directory: mobile
        run: jarsigner -verify -strict build/app/outputs/bundle/release/app-release.aab
